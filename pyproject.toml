[project]
name = "autonomous-agent-algos"
version = "0.0.1"
description = "Async, event-driven library of production-deployable agent algorithms over arbitrary data."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "anyio>=4.4", "httpx>=0.27"]

[project.optional-dependencies]
litellm = ["litellm"]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "pyright", "asyncpg>=0.29", "redis>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
