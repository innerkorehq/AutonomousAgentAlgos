name: ci

# Lint + type-check, then the full test suite against REAL Postgres and Redis, on Python 3.11 and 3.12.
# (Docs have their own workflow, docs.yml, which also runs the docs tests before publishing.)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: pyright (src, examples, scripts)
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: aaa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite creates a throwaway database per test and isolates Redis by key prefix.
      AAA_TEST_POSTGRES_URL: postgresql://postgres:aaa@localhost:5432/postgres
      AAA_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - name: tests
        # -v names every test, and a test stuck for 2 minutes dumps all thread stacks, so a hang is
        # diagnosable from the log instead of just a cancelled job.
        run: uv run pytest -v -p no:cacheprovider -o faulthandler_timeout=120
