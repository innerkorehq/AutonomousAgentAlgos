name: ci

# Lint + type-check, then the full test suite against REAL Postgres and Redis, on Python 3.11 and 3.12.
# (Docs have their own workflow, docs.yml, which also runs the docs tests before publishing.)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # weekly: do the memory libraries' newest releases still match our adapters?

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: pyright (src, examples, scripts)
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: aaa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite creates a throwaway database per test and isolates Redis by key prefix.
      AAA_TEST_POSTGRES_URL: postgresql://postgres:aaa@localhost:5432/postgres
      AAA_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - name: tests
        # -v names every test, and a test stuck for 2 minutes dumps all thread stacks, so a hang is
        # diagnosable from the log instead of just a cancelled job.
        run: uv run pytest -v -p no:cacheprovider -o faulthandler_timeout=120

  adapters:
    # The memory adapters are tested against stand-ins; this job replays their calls against the REAL
    # Mem0, Graphiti and LangGraph signatures (tests/unit/test_memory_signatures.py), which are skipped
    # in the main job because those libraries are not dev dependencies.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Locked versions
        run: |
          uv sync --frozen --extra mem0 --extra graphiti --extra langgraph --extra langmem --extra mcp
          uv run pytest -v -p no:cacheprovider tests/unit/test_memory_signatures.py tests/unit/test_memory_adapters.py tests/unit/test_memory_contract.py tests/unit/test_mcp.py tests/unit/test_examples.py -k "not cluster"
      - name: OpenAI SDK types (conformance of the Responses client; not a runtime dependency)
        run: |
          uv pip install openai
          uv run --no-sync pytest -v -p no:cacheprovider tests/unit/test_openai_conformance.py
      - name: MCP SDK 1.x (the lock resolves 2.x; both are supported)
        run: |
          uv pip install "mcp<2"
          uv run --no-sync pytest -v -p no:cacheprovider tests/unit/test_mcp.py
      - name: Newest releases (scheduled and manual runs only)
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: |
          uv pip install --upgrade mem0ai graphiti-core langgraph langmem mcp openai
          uv run --no-sync pytest -v -p no:cacheprovider tests/unit/test_memory_signatures.py tests/unit/test_mcp.py tests/unit/test_openai_conformance.py
